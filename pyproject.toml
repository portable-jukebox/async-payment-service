[project]
name = "payment-service-async"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "faststream[cli,rabbit]>=0.7.8",
    "httpx>=0.28.1",
    "httpcore>=1.0.9,<2",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
    "prometheus-client>=0.21,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = [
    "integration: requires the isolated Docker test infrastructure",
    "rabbitmq: requires the isolated RabbitMQ broker",
    "runtime: requires the runtime profile of compose.test.yaml",
]
